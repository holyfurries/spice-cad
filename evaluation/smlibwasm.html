<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SMLib rack evaluation</title>
  <style>
    body {
      max-width: 1100px;
      margin: 32px auto;
      padding: 0 20px;
      font: 16px system-ui;
      color: #243040;
    }
    h1 {
      font-size: 26px;
    }
    .views {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
    }
    img {
      width: 100%;
    }
    pre {
      padding: 20px;
      background: #f2f5f8;
      overflow: auto;
      font-size: 13px;
    }
    button,
    a {
      margin-right: 12px;
    }
  </style>
  <h1>SMLib / OpenCascade: front-left rack part</h1>
  <p>
    Local evaluation of @classcad/smlibwasm 0.3.0. Dimensions and joints follow
    the Rust generator.
  </p>
  <button id="run">Run evaluation</button>
  <span id="status" role="status">Ready</span>
  <p>
    <a id="step" hidden>Download SMLib STEP</a
    ><a id="stl" hidden>Download SMLib STL</a>
  </p>
  <div class="views">
    <figure>
      <img id="smlib_image" alt="SMLib front-left rack part" />
      <figcaption>SMLib, print orientation</figcaption>
    </figure>
    <figure>
      <img id="reference_image" alt="OpenCascade reference rack part" />
      <figcaption>OpenCascade STEP imported into SMLib</figcaption>
    </figure>
  </div>
  <pre id="report">No results yet.</pre>
  <script type="module">
    const status = document.querySelector("#status");
    const run_button = document.querySelector("#run");
    const urls = [];
    const check = (condition, message) => {
      if (!condition) {
        throw new Error(message);
      }
    };
    let cad;

    function box(minimum_mm, maximum_mm) {
      const size_mm = minimum_mm.map(
        (value, index) => maximum_mm[index] - value,
      );
      check(
        size_mm.every((value) => value > 0),
        "Empty box",
      );
      const original = cad.Box(...size_mm, { align: cad.Align.MIN });
      try {
        return original.translate(minimum_mm);
      } finally {
        original.dispose();
      }
    }

    function combine(current, tool, operation) {
      try {
        return current[operation](tool);
      } finally {
        current.dispose();
        tool.dispose();
      }
    }

    function dovetail(origin_mm, side_panel = false) {
      const outline = cad.Polygon([-1, -4], [6, -8], [6, 8], [-1, 4]);
      const original = outline.extrude(3);
      outline.dispose();
      if (side_panel) {
        const rotated = original.rotate(
          new cad.Axis([0, 0, 0], [1, 1, 1]),
          120,
        );
        original.dispose();
        try {
          return rotated.translate(origin_mm);
        } finally {
          rotated.dispose();
        }
      }
      try {
        return original.translate(origin_mm);
      } finally {
        original.dispose();
      }
    }

    function build_front_left() {
      let rack = box([0, 0, 0], [310, 283, 3]);
      for (let step_index = 0; step_index < 5; step_index++) {
        const y_mm = step_index * 56;
        const z_mm = step_index * 42;
        for (const x_mm of [0, 307]) {
          rack = combine(
            rack,
            box([x_mm, y_mm, 0], [x_mm + 3, y_mm + 56, z_mm + 11]),
            "fuse",
          );
        }
        rack = combine(
          rack,
          box([0, y_mm, z_mm], [310, y_mm + 56, z_mm + 3]),
          "fuse",
        );
        rack = combine(
          rack,
          box([0, y_mm, Math.max(0, z_mm - 42)], [310, y_mm + 3, z_mm + 11]),
          "fuse",
        );
      }
      rack = combine(rack, box([0, 280, 0], [310, 283, 179]), "fuse");
      rack = combine(rack, box([0, 0, 0], [155, 283, 179]), "intersect");
      for (let step_index = 0; step_index < 5; step_index++) {
        const levels_mm = step_index === 0 ? [0] : [0, step_index * 42];
        for (const z_mm of levels_mm) {
          rack = combine(
            rack,
            dovetail([155, (step_index + 0.5) * 56, z_mm]),
            "fuse",
          );
        }
      }
      rack = combine(rack, box([0, 0, 0], [310, 168, 179]), "intersect");
      for (const height_fraction of [0.25, 0.75]) {
        rack = combine(
          rack,
          dovetail([0, 168, 95 * height_fraction], true),
          "fuse",
        );
      }
      const rotated = rack.rotate(cad.Y, -90);
      rack.dispose();
      try {
        return rotated.translate(rotated.bbox().min.neg());
      } finally {
        rotated.dispose();
      }
    }

    function audit_stl(bytes) {
      const mesh = cad.fromStl(bytes);
      check(mesh.triangles.length > 0, "Empty STL");
      check(mesh.triangles.length <= 300000, "STL exceeds evaluation budget");
      const edges = new Map();
      let volume_mm3 = 0;
      let overhang_count = 0;
      for (let index = 0; index < mesh.triangles.length; index += 3) {
        const triangle = Array.from(
          mesh.triangles.slice(index, index + 3),
          (vertex_index) =>
            new cad.Vector(
              mesh.vertices.slice(vertex_index * 3, vertex_index * 3 + 3),
            ),
        );
        const [first, second, third] = triangle;
        volume_mm3 += first.dot(second.cross(third)) / 6;
        const normal = second.sub(first).cross(third.sub(first));
        check(normal.length > 0, "Degenerate triangle");
        if (triangle.some((point) => Math.abs(point.z) > 0.00001)) {
          if (normal.normalized().z < -Math.SQRT1_2 - 0.00001) {
            overhang_count++;
          }
        }
        for (const [source, target] of [
          [0, 1],
          [1, 2],
          [2, 0],
        ]) {
          const source_key = triangle[source]
            .toArray()
            .map((value) => Math.round(value * 100000))
            .join(",");
          const target_key = triangle[target]
            .toArray()
            .map((value) => Math.round(value * 100000))
            .join(",");
          check(source_key !== target_key, "Collapsed mesh edge");
          const forward = source_key < target_key;
          const key = forward
            ? `${source_key}|${target_key}`
            : `${target_key}|${source_key}`;
          const entry = edges.get(key) ?? [0, 0];
          entry[0]++;
          entry[1] += forward ? 1 : -1;
          edges.set(key, entry);
        }
      }
      return {
        triangle_count: mesh.triangles.length / 3,
        closed_and_oriented: Array.from(edges.values()).every(
          ([count, orientation]) => count === 2 && orientation === 0,
        ),
        volume_mm3,
        overhang_count,
        dimensions_mm: mesh.bbox().size.toArray(),
      };
    }

    function base64(bytes) {
      check(bytes.length <= 5000000, "Export exceeds evaluation budget");
      let binary = "";
      for (let offset = 0; offset < bytes.length; offset += 8192) {
        binary += String.fromCharCode(...bytes.subarray(offset, offset + 8192));
      }
      return btoa(binary);
    }

    function set_file(selector, bytes, mime, name) {
      const url = URL.createObjectURL(new Blob([bytes], { type: mime }));
      urls.push(url);
      const element = document.querySelector(selector);
      if (element.tagName === "IMG") {
        element.src = url;
      } else {
        element.href = url;
        element.download = name;
        element.hidden = false;
      }
    }

    async function evaluate() {
      run_button.disabled = true;
      window.evaluation_done = false;
      status.textContent = "Evaluating…";
      while (urls.length > 0) {
        URL.revokeObjectURL(urls.pop());
      }
      let shape;
      let reference;
      let roundtrip;
      try {
        const import_start_ms = performance.now();
        cad = await import("../output/evaluation/vendor/package/dist/index.js");
        const module_import_ms = performance.now() - import_start_ms;
        const generation_ms_samples = [];
        for (let sample_index = 0; sample_index < 5; sample_index++) {
          shape?.dispose();
          const start_ms = performance.now();
          shape = build_front_left();
          generation_ms_samples.push(performance.now() - start_ms);
        }
        check(shape.isValid(), "Generated SMLib part is invalid");
        const step_start_ms = performance.now();
        const step = cad.toStep(shape, {
          unit: "mm",
          name: "spice-rack-front-left-smlib",
        });
        const step_export_ms = performance.now() - step_start_ms;
        const stl_start_ms = performance.now();
        const stl = cad.toStl(shape, { tolerance: 0.1, angle: 15 });
        const stl_export_ms = performance.now() - stl_start_ms;
        const audit = audit_stl(stl);
        check(
          audit.closed_and_oriented,
          "SMLib STL is not closed and oriented",
        );
        check(audit.volume_mm3 > 0, "SMLib STL has non-positive volume");
        check(audit.overhang_count === 0, "SMLib STL has a steep overhang");
        const reference_step = await fetch(
          "../output/spice-rack-front-left.step",
        ).then((response) => {
          check(response.ok, "Reference STEP could not be fetched");
          return response.text();
        });
        reference = cad.fromStep(reference_step);
        check(
          reference instanceof cad.Part,
          "Reference STEP did not import as one Part",
        );
        check(reference.isValid(), "Imported OpenCascade STEP is invalid");
        const reference_stl = await fetch(
          "../output/spice-rack-front-left.stl",
        ).then((response) => {
          check(response.ok, "Reference STL could not be fetched");
          return response.arrayBuffer();
        });
        const reference_audit = audit_stl(new Uint8Array(reference_stl));
        roundtrip = cad.fromStep(step);
        check(
          roundtrip instanceof cad.Part,
          "SMLib STEP did not reimport as one Part",
        );
        check(roundtrip.isValid(), "Reimported SMLib STEP is invalid");
        const report = {
          package: "@classcad/smlibwasm",
          version: cad.version,
          browser: navigator.userAgent,
          part: "front-left",
          expected_dimensions_mm: [95, 174, 161],
          module_import_ms,
          generation_ms_samples,
          step_export_ms,
          stl_export_ms,
          generated: {
            valid: shape.isValid(),
            dimensions_mm: shape.bbox().size.toArray(),
            volume_mm3: shape.volume,
            stl: audit,
          },
          reference: {
            valid: reference.isValid(),
            dimensions_mm: reference.bbox().size.toArray(),
            volume_mm3: reference.volume,
            stl: reference_audit,
          },
          step_roundtrip: {
            valid: roundtrip.isValid(),
            volume_mm3: roundtrip.volume,
            dimensions_mm: roundtrip.bbox().size.toArray(),
          },
          exports: {
            step_bytes: new TextEncoder().encode(step).length,
            stl_bytes: stl.length,
          },
        };
        for (const actual_mm of [
          report.generated.dimensions_mm,
          report.reference.dimensions_mm,
          report.step_roundtrip.dimensions_mm,
        ]) {
          check(
            actual_mm.every(
              (value, index) =>
                Math.abs(value - report.expected_dimensions_mm[index]) <
                0.00001,
            ),
            "Dimensions differ",
          );
        }
        check(
          Math.abs(shape.volume - reference.volume) < 0.001,
          "Reference volume differs",
        );
        const smlib_image = cad.render(shape, {
          size: [640, 480],
          edges: true,
          tolerance: 0.1,
          supersample: 1,
        });
        const reference_image = cad.render(reference, {
          size: [640, 480],
          edges: true,
          tolerance: 0.1,
          supersample: 1,
          frame: smlib_image.frame,
        });
        set_file("#smlib_image", smlib_image.data, "image/png");
        set_file("#reference_image", reference_image.data, "image/png");
        set_file(
          "#step",
          step,
          "application/step",
          "spice-rack-front-left-smlib.step",
        );
        set_file("#stl", stl, "model/stl", "spice-rack-front-left-smlib.stl");
        window.evaluation_result = {
          report,
          step,
          stl_base64: base64(stl),
          image_base64: base64(smlib_image.data),
          reference_image_base64: base64(reference_image.data),
        };
        document.querySelector("#report").textContent = JSON.stringify(
          report,
          null,
          2,
        );
        status.textContent = "Passed browser checks";
      } catch (error) {
        window.evaluation_result = { error: String(error), stack: error.stack };
        document.querySelector("#report").textContent = JSON.stringify(
          window.evaluation_result,
          null,
          2,
        );
        status.textContent = "Evaluation failed";
      } finally {
        shape?.dispose();
        reference?.dispose();
        roundtrip?.dispose();
        window.evaluation_done = true;
        run_button.disabled = false;
      }
    }
    run_button.addEventListener("click", evaluate);
    if (new URLSearchParams(location.search).has("run")) {
      evaluate();
    }
  </script>
</html>
