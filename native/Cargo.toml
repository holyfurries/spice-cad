[package]
name = "spice-cad"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false

[features]
rack-tools = ["spice-rack/reference"]

[dependencies]
spice-rack = { path = "..", default-features = false }
glam = "=0.24.2"
cxx = "=1.0.194"
eframe = { version = "=0.37.0", default-features = false, features = ["clipboard", "default_fonts", "wgpu", "x11", "wayland"] }
bytemuck = { version = "1", features = ["derive"] }
mlua = { version = "=0.12.2", default-features = false, features = ["luau", "vendored"] }
ropey = "1.6.1"
libc = "0.2"
tree-sitter = "0.25.10"
tree-sitter-luau = "1.2.0"
serde_json = "1"
url = "2"
png = "=0.18.1"

[build-dependencies]
cxx-build = "=1.0.194"

[dev-dependencies]
spice-rack = { path = "..", features = ["reference"] }
opencascade = { version = "=0.3.0", default-features = false }
