name: Build and package
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      native: ${{ steps.changes.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect native changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FORCE_CHECKS: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$FORCE_CHECKS" = true ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" HEAD -- Cargo.toml Cargo.lock flake.nix flake.lock crates tools examples .github; then
            echo "native=false" >> "$GITHUB_OUTPUT"
          else
            echo "native=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Check formatting and workflow
        run: |
          nix develop .#format -c cargo fmt --all -- --check
          nix develop .#format -c cargo fmt --manifest-path tools/game-import/Cargo.toml -- --check
          nix develop .#format -c nixfmt --check flake.nix
          nix develop .#format -c actionlint
          nix develop .#format -c yamlfmt -lint .github/workflows/build.yml
  linux:
    needs: format
    if: needs.format.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Cache Nix tools and native kernel
        id: nix-cache
        uses: nix-community/cache-nix-action/restore@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-tools-v2-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-tools-v2-${{ runner.os }}-
      - name: Prepare pinned tools
        run: nix develop .#ci --profile .ci-environment -c true
      - name: Save native tools before compiling Rust
        if: steps.nix-cache.outputs.hit-primary-key != 'true'
        uses: nix-community/cache-nix-action/save@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-tools-v2-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          gc-max-store-size-linux: 3G
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cmd-format: nix develop .#ci -c {0}
          key: ${{ hashFiles('flake.lock', 'flake.nix') }}
          cache-bin: "false"
          shared-key: native
      - name: Lint
        run: nix develop .#ci -c cargo clippy --locked -p spice-cad --all-targets -- -D warnings
      - name: Test
        run: nix develop .#ci -c cargo test --locked -p spice-cad
  verification:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [format, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
      SPICE_CAD_ARTIFACTS: ${{ github.workspace }}/verification-artifacts
      SPICE_CAD_CONTAINER: spice-cad-verification
      SPICE_CAD_BIN: ${{ github.workspace }}/target/debug/packaged-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false
      - name: Cache independent verification tools
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-verification-v1-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          restore-prefixes-first-match: nix-verification-v1-${{ runner.os }}-
          restore-prefixes-all-matches: nix-tools-v2-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          gc-max-store-size-linux: 3G
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cmd-format: nix develop .#verification -c {0}
          workspaces: |
            . -> target
            tools/game-import -> target
          key: ${{ hashFiles('flake.lock', 'flake.nix') }}
          shared-key: native
          cache-bin: "false"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spice-cad-x86_64-linux
          path: dist
      - name: Prepare packaged app without Nix
        run: |
          mkdir -p "$SPICE_CAD_ARTIFACTS"
          echo "SPICE_CAD_OWNER=$(id -u):$(id -g)" >> "$GITHUB_ENV"
          (cd dist && sha256sum -c SHA256SUMS)
          chmod +x dist/spice-cad-x86_64-linux.AppImage
          docker run --detach --name "$SPICE_CAD_CONTAINER" --network none \
            --cap-add SYS_ADMIN \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --user 0:0 --env HOME=/tmp \
            --mount "type=bind,source=$PWD/dist,target=/download,readonly" \
            --mount "type=bind,source=$SPICE_CAD_ARTIFACTS,target=$SPICE_CAD_ARTIFACTS" \
            ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac \
            sleep infinity
          docker exec "$SPICE_CAD_CONTAINER" test ! -e /nix/store
          docker exec "$SPICE_CAD_CONTAINER" mkdir /app
          docker exec --workdir /app "$SPICE_CAD_CONTAINER" \
            /download/spice-cad-x86_64-linux.AppImage --appimage-extract \
            > "$SPICE_CAD_ARTIFACTS/extraction.log" 2>&1
          docker exec "$SPICE_CAD_CONTAINER" test -x /app/squashfs-root/AppRun
      - name: Verify packaged exports with OpenCascade
        run: |
          nix develop .#verification --profile .verification-environment -c sh -eu -c '
            cargo build --locked -p spice-cad-verification --bin packaged-app
            cargo clippy --locked -p spice-cad-verification --all-targets -- -D warnings
            cargo test --locked -p spice-cad-verification
          ' 2>&1 | tee "$SPICE_CAD_ARTIFACTS/verification.log"
      - name: Verify game exports with strict Bevy loader
        env:
          SPICE_IMPORT_ARTIFACTS: ${{ env.SPICE_CAD_ARTIFACTS }}/game-import
        run: |
          nix develop .#verification -c sh -eu -c '
            cargo clippy --locked --manifest-path tools/game-import/Cargo.toml --all-targets -- -D warnings
            cargo test --locked --manifest-path tools/game-import/Cargo.toml
            cargo test --locked --manifest-path tools/game-import/Cargo.toml --test bundles -- --ignored --nocapture
          ' 2>&1 | tee "$SPICE_CAD_ARTIFACTS/game-import.log"
      - name: Upload game import evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spice-cad-game-import
          path: |
            verification-artifacts/game-import/
            verification-artifacts/game-import.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop packaged app container
        if: always()
        run: |
          if docker container inspect "$SPICE_CAD_CONTAINER" >/dev/null 2>&1; then
            trap 'docker rm --force "$SPICE_CAD_CONTAINER"' EXIT
            docker logs "$SPICE_CAD_CONTAINER" > "$SPICE_CAD_ARTIFACTS/container.log" 2>&1
            docker exec "$SPICE_CAD_CONTAINER" chown -R "$(id -u):$(id -g)" "$SPICE_CAD_ARTIFACTS"
          fi
      - name: Upload verification failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spice-cad-verification-failure
          path: verification-artifacts/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
  package:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: format
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Cache release builds
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-release-v1-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}-${{ github.sha }}
          restore-prefixes-first-match: |
            nix-release-v1-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}-
          restore-prefixes-all-matches: nix-tools-v2-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix') }}
          gc-max-store-size-linux: 3G
      - name: Keep native tools available for subsequent releases
        run: nix develop .#ci --profile .ci-environment -c true
      - name: Build AppImage
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(nix eval --raw .#spice-cad.version)"
          nix build --out-link appimage .#spice-cad-appimage
          mkdir -p dist
          cp -L appimage dist/spice-cad-x86_64-linux.AppImage
          chmod +x dist/spice-cad-x86_64-linux.AppImage
      - name: Exercise download without Nix
        run: |
          docker run --rm --network none \
            --cap-add SYS_ADMIN \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            --user 0:0 --env HOME=/tmp --env APPIMAGE_EXTRACT_AND_RUN=1 \
            --mount "type=bind,source=$PWD/dist,target=/download,readonly" \
            --mount "type=bind,source=$PWD/examples,target=/examples,readonly" \
            ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac \
            /bin/bash -euc '
              test ! -e /nix/store
              /download/spice-cad-x86_64-linux.AppImage --check-model /examples/mounting-bracket.luau
              /download/spice-cad-x86_64-linux.AppImage --export-model /examples/mounting-bracket.luau /tmp/print
              /download/spice-cad-x86_64-linux.AppImage --export-game /examples/mounting-bracket.luau /tmp/game
              test -s /tmp/print/model.step
              test -s /tmp/print/model.stl
              test -s /tmp/game/model.glb
            '
      - name: Assemble download and checksums
        run: |
          cp LICENSE NOTICE ASSETS.md dist/
          cp -r licenses dist/
          mkdir -p dist/crates/spice-cad/assets
          cp crates/spice-cad/assets/LICENSE dist/crates/spice-cad/assets/
          cp docs/releases.md dist/INSTALL.md
          git archive --format=tar.gz --prefix=spice-cad-source/ HEAD > dist/spice-cad-source.tar.gz
          cd dist
          sha256sum spice-cad-x86_64-linux.AppImage spice-cad-source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spice-cad-x86_64-linux
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, package, verification]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: spice-cad-x86_64-linux
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tar -czf spice-cad-x86_64-linux.tar.gz -C dist .
          sha256sum spice-cad-x86_64-linux.tar.gz > spice-cad-x86_64-linux.tar.gz.sha256
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "Spice CAD $RELEASE_TAG" --notes-file docs/releases.md \
            spice-cad-x86_64-linux.tar.gz spice-cad-x86_64-linux.tar.gz.sha256
