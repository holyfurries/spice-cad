[package]
name = "spice-game-import"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"
description = "Independent Crowns Adrift glTF loader acceptance gate"

[dependencies]
bevy = { version = "=0.19.1", default-features = false, features = ["bevy_gltf", "bevy_mesh", "bevy_image", "gltf_animation"] }
serde_json = "1"
sha2 = "0.10"
gltf-json = { version = "=1.4.1", features = ["allow_external_materials_specular"] }

[dev-dependencies]
gltf = { version = "=1.4.1", default-features = false }
png = "=0.18.1"

[patch.crates-io]
gltf-json = { path = "vendor/gltf-json" }
